  horario:
    - inicio: "07:00"
      fin: "08:00"
      clases: { mar: bjj, jue: bjj }
    - inicio: "19:00"
      fin: "20:00"
      clases: { mar: mma, jue: mma }
    - inicio: "20:00"
      fin: "21:00"
      clases: { mar: bjj, jue: bjj }
  fotos:
    - { src: "img/em1.jpg", alt: "Equipo en Dmoov Escuela Militar", pos: "center 55%" }
    - { src: "img/em3.jpg", alt: "Grupo de alumnos en Escuela Militar", pos: "center 55%" }
    - { src: "img/em5.jpg", alt: "Alumnos después de clase", pos: "center 40%" }
    - { src: "img/em6.jpg", alt: "Equipo después del entrenamiento", pos: "center 45%" }
    - { src: "img/em2.jpg", alt: "Profesores en Dmoov", pos: "center 8%" }
    - { src: "img/em4.jpg", alt: "Compañeros de entrenamiento", pos: "center 35%" }
