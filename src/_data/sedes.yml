# Sedes: horario semanal y fotos de la galería.
# En cada fila, "clases" asigna a cada día (lun..sab) una clase de textos.yml > horarios.clases.
# "pos" es el encuadre de la foto (object-position).

nunoa:
  nombre: "Ñuñoa"
  titulo: "Sede Templo Ñuñoa"
  lugar: "Ñuñoa, Santiago"
  mapa: "https://maps.app.goo.gl/mrYdjd1vUy4y8cA1A"
  horario:
    - inicio: "09:00"
      fin: ""
      clases: { lun: bjj, mie: bjj, vie: bjj }
    - inicio: "16:00"
      fin: "17:30"
      clases: { sab: super }
    - inicio: "17:30"
      fin: "19:00"
      clases: { sab: mma_iniciantes }
    - inicio: "19:00"
      fin: "20:00"
      clases: { lun: mma, mie: mma, vie: mma }
    - inicio: "20:00"
      fin: "21:30"
      clases: { lun: bjj_iniciantes, mie: bjj, vie: bjj }
  fotos:
    - { src: "img/equipo.jpg", alt: "Equipo de Templo Ñuñoa", pos: "center 45%" }
    - { src: "img/guardia.jpg", alt: "Trabajo de guardia", pos: "center 60%" }
    - { src: "img/graduacion.jpg", alt: "Graduación de faixa azul", pos: "center 35%" }
    - { src: "img/azul.jpg", alt: "Técnica en el tatami", pos: "center 45%" }
    - { src: "img/senseis.jpg", alt: "Profesores en seiza", pos: "center 40%" }
    - { src: "img/control.jpg", alt: "Control y presión", pos: "center 45%" }
    - { src: "img/templo.jpg", alt: "Rodando en Templo", pos: "center 50%" }

militar:
  nombre: "Escuela Militar"
  titulo: "Sede Dmoov Escuela Militar"
  lugar: "Escuela Militar, Las Condes"
